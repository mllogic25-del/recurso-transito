databases:
  - name: autorecurso-db
    plan: free
    databaseName: autorecurso
    user: autorecurso_user

services:
  - type: web
    name: autorecurso
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx next build
    startCommand: node start.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autorecurso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: "AutoRecurso - Sistema de Recursos de Trânsito"
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "5579998340176"
      - key: NODE_ENV
        value: production
